<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PengPeng Status - ドラクエ風</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.8;
        }

        .container {
            background: rgba(16, 20, 31, 0.95);
            border: 4px solid #4a5568;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5),
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #4a5568;
            padding-bottom: 20px;
        }

        .title {
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .level {
            font-size: 20px;
            color: #00ff88;
            margin-top: 5px;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #4a5568;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .bar-container {
            margin: 15px 0;
        }

        .bar-label {
            font-size: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .bar {
            height: 20px;
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 1s ease;
            position: relative;
        }

        .bar-fill.hp {
            background: linear-gradient(90deg, #ff4444 0%, #ff6666 100%);
        }

        .bar-fill.mp {
            background: linear-gradient(90deg, #4444ff 0%, #6666ff 100%);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            border: 1px solid #4a5568;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
        }

        .exp-box {
            text-align: center;
            font-size: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 4px;
        }

        .loading {
            text-align: center;
            font-size: 12px;
            color: #888;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .error {
            color: #ff4444;
            text-align: center;
            font-size: 10px;
            padding: 20px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px;
            }
            
            .title {
                font-size: 12px;
            }
            
            .level {
                font-size: 16px;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .stat-item {
                font-size: 10px;
            }
        }

        .divider {
            border: 0;
            border-top: 2px solid #4a5568;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🐧 PengPeng</div>
            <div class="level" id="level">Lv.?</div>
        </div>

        <div id="content" class="loading">
            Loading STATUS.md...
        </div>
    </div>

    <script>
        const STATUS_URL = 'https://raw.githubusercontent.com/pengpengagent-cell/workspace-backup/main/STATUS.md';
        
        const LEVEL_THRESHOLDS = [
            { lv: 1, tasks: 0 },
            { lv: 2, tasks: 50 },
            { lv: 3, tasks: 150 },
            { lv: 4, tasks: 300 },
            { lv: 5, tasks: 500 },
            { lv: 6, tasks: 750 },
            { lv: 7, tasks: 1050 },
            { lv: 8, tasks: 1400 },
            { lv: 9, tasks: 1800 },
            { lv: 10, tasks: 2250 }
        ];

        function calculateLevel(totalTasks) {
            for (let i = LEVEL_THRESHOLDS.length - 1; i >= 0; i--) {
                if (totalTasks >= LEVEL_THRESHOLDS[i].tasks) {
                    return {
                        lv: LEVEL_THRESHOLDS[i].lv,
                        current: totalTasks,
                        threshold: LEVEL_THRESHOLDS[i].tasks,
                        next: LEVEL_THRESHOLDS[i + 1]?.tasks || 999999
                    };
                }
            }
            return { lv: 1, current: totalTasks, threshold: 0, next: 50 };
        }

        function parseStatusMd(text) {
            const lines = text.split('\n');
            const data = {
                cumulative: {},
                weekly: {},
                daily: {}
            };

            let section = null;

            for (const line of lines) {
                if (line.includes('## Cumulative')) {
                    section = 'cumulative';
                } else if (line.includes('## Weekly Summary')) {
                    section = 'weekly';
                } else if (line.includes('## Daily Metrics')) {
                    section = 'daily';
                } else if (section && line.includes('|') && !line.includes('---')) {
                    const parts = line.split('|').map(s => s.trim()).filter(s => s);
                    if (parts.length === 2 && parts[0] && parts[1]) {
                        const key = parts[0];
                        const value = parts[1];
                        
                        if (!isNaN(value)) {
                            data[section][key] = parseFloat(value);
                        } else if (value.includes('%')) {
                            data[section][key] = parseFloat(value.replace('%', ''));
                        } else {
                            data[section][key] = value;
                        }
                    }
                }
            }

            return data;
        }

        function renderStatus(data) {
            const totalTasks = data.cumulative.total_tasks_completed || 0;
            const cronSuccessRate = data.weekly.cron_success_rate || 0;
            const selfResolutionRate = data.weekly.self_resolution_rate || 0;
            const initiativeRate = data.weekly.initiative_execution_rate || 0;
            const auditFindings = data.cumulative.total_audit_findings || 0;
            const tasksThisWeek = data.daily.tasks_completed || 0;

            const levelInfo = calculateLevel(totalTasks);
            
            const hp = Math.round(cronSuccessRate * 10);
            const maxHp = 1000;
            const mp = Math.round((1 - (cronSuccessRate / 100)) * 1000);
            const maxMp = 1000;

            const chikara = tasksThisWeek;
            const subayasa = Math.round(initiativeRate * 30 / 100);
            const kashikosa = auditFindings;
            const minomamori = Math.round(selfResolutionRate * 30 / 100);
            const unnoyosa = Math.round(cronSuccessRate / 10);

            const expToNext = levelInfo.next - levelInfo.current;

            document.getElementById('level').textContent = `Lv.${levelInfo.lv}`;

            const html = `
                <div class="status-box">
                    <div class="bar-container">
                        <div class="bar-label">
                            <span>HP</span>
                            <span>${hp}/${maxHp}</span>
                        </div>
                        <div class="bar">
                            <div class="bar-fill hp" style="width: ${(hp / maxHp * 100)}%"></div>
                        </div>
                    </div>

                    <div class="bar-container">
                        <div class="bar-label">
                            <span>MP</span>
                            <span>${mp}/${maxMp}</span>
                        </div>
                        <div class="bar">
                            <div class="bar-fill mp" style="width: ${(mp / maxMp * 100)}%"></div>
                        </div>
                    </div>
                </div>

                <hr class="divider">

                <div class="stats">
                    <div class="stat-item">
                        <span>ちから</span>
                        <span class="stat-value">${chikara}</span>
                    </div>
                    <div class="stat-item">
                        <span>すばやさ</span>
                        <span class="stat-value">${subayasa}</span>
                    </div>
                    <div class="stat-item">
                        <span>かしこさ</span>
                        <span class="stat-value">${kashikosa}</span>
                    </div>
                    <div class="stat-item">
                        <span>みのまもり</span>
                        <span class="stat-value">${minomamori}</span>
                    </div>
                    <div class="stat-item">
                        <span>うんのよさ</span>
                        <span class="stat-value">${unnoyosa}</span>
                    </div>
                </div>

                <hr class="divider">

                <div class="exp-box">
                    つぎのレベルまで<br>
                    あと <span style="color: #ffd700; font-size: 12px;">${expToNext}</span> EXP
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        async function loadStatus() {
            try {
                const response = await fetch(STATUS_URL);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const text = await response.text();
                const data = parseStatusMd(text);
                renderStatus(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ERROR<br><br>
                        Failed to load STATUS.md<br>
                        ${error.message}
                    </div>
                `;
            }
        }

        loadStatus();
        setInterval(loadStatus, 60000); // 1分ごとに更新
    </script>
</body>
</html>
